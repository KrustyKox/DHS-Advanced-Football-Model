name: Update Advanced Football Model

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "app.py"
      - "requirements.txt"
      - "requirements-model.txt"
      - "runtime.txt"
      - "pytest.ini"
      - ".gitignore"
      - ".github/workflows/update_model.yml"

permissions:
  contents: write

concurrency:
  group: advanced-football-model
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      PARLAY_NFL_ODDS_PATH: ${{ vars.PARLAY_NFL_ODDS_PATH }}
      PARLAY_CFB_ODDS_PATH: ${{ vars.PARLAY_CFB_ODDS_PATH }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-model.txt
      - name: Unit tests
        run: pytest -q
      - name: Build projections and evaluate markets
        run: python scripts/run_pipeline.py
      - name: Validate publication
        run: python scripts/validate_outputs.py
      - name: Commit generated JSON only
        run: |
          git config user.name "DHS Advanced Model Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/output data/locks data/raw/*_schema.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh advanced football projections and tracking"
          git pull --rebase origin main
          git push origin main

